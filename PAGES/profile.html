<!DOCTYPE html>
<html>

<head>

    <title>Student Hub Portal | Profile</title>

    <link rel="stylesheet" href="../css/profile.css">

</head>

<body>

    <h2>Profile Page</h2>

    <p>
        This page is generally for viewing and editing your profile information.
    </p>


    <h2>Student Profile</h2>


    <p>
        Select students.json file:
    </p>

    <input
        type="file"
        id="studentJSONFile"
        accept=".json"
    >

    <button
        type="button"
        onclick="loadStudentProfile()"
    >
        Load Profile
    </button>


    <br><br>


    <p id="studentLoading">
        Loading profile...
    </p>


    <p id="studentError"></p>


    <div id="studentProfile">

    </div>


    <br><br><br>


    <footer>
        @2026 Student Hub Portal
    </footer>


    <script src="../JS/javascript.js"></script>

</body>

</html>
